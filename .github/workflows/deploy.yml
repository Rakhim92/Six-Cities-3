name: Deploy static content to Pages

on:
  push:
    branches: ["master"] # или "master", в зависимости от вашей главной ветки

# Разрешения, необходимые для деплоя в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет параллельно запущенные сборки, если пуши идут один за другим
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # или 'yarn' / 'pnpm', если используете их

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Папка, куда Vite собирает проект по умолчанию
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
